---
- name: Deploy WAR file on Tomcat
  hosts: webservers
  become: yes

  tasks:

    - name: Copy WAR file to Tomcat webapps
      ansible.builtin.copy:
        src: mcapp-1.0.jar
        dest: /opt/tomcat/webapps/mcapp-1.0.jar
        owner: tomcat
        group: tomcat
        mode: '0644'

    - name: Restart Tomcat
      ansible.builtin.systemd:
        name: tomcat
        state: restarted
```
